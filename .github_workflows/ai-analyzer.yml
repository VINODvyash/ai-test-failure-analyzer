name: AI Test Failure Analyzer

on:
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-failures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Pytest Suite
        id: run_tests
        continue-on-error: true
        run: |
          pytest -v
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Comment JSON Report on PR if Tests Fail
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Check if reports directory exists
            const reportsDir = path.join(process.env.GITHUB_WORKSPACE, 'reports');
            if (fs.existsSync(reportsDir)) {
              const files = fs.readdirSync(reportsDir).filter(f => f.endsWith('.json'));
              
              if (files.length > 0) {
                // Read the latest JSON report
                const latestFile = files.sort().pop();
                const reportContent = fs.readFileSync(path.join(reportsDir, latestFile), 'utf8');
                
                const commentBody = `### 🤖 AI Test Failure Diagnosis\n\`\`\`json\n${reportContent}\n\`\`\``;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: commentBody
                });
              }
            }